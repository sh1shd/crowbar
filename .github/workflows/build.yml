name: Release Docker image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Determine platforms
        id: platforms
        run: |
          case "${{ inputs.platforms }}" in
            amd64)
              echo "value=linux/amd64" >> $GITHUB_OUTPUT
              ;;
            arm64)
              echo "value=linux/arm64/v8" >> $GITHUB_OUTPUT
              ;;
            all)
              echo "value=linux/amd64,linux/arm64/v8" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/sh1shd/crowbar
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ steps.platforms.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}